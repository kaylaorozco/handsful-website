<!doctype html>
<!--
  Handsful "blob chase" — reusable motion spec + live demo
  =========================================================
  Extracted from the website hero intro (src/sections/Hero.astro) so the
  app can reuse it for loading screens and the splash/intro animation.
  Self-contained: open this file directly in a browser.

  Two variants:
    1. LOADER — the two sibling blobs spring apart, then chase each other
       around a shared track forever, morphing lava-lamp style. Loops
       seamlessly (each lap ends where it began); safe to show for any
       duration.
    2. SPLASH — the one-shot intro: chase for one lap, then the gradient
       blob takes over the screen while the coral blob blurs and melts
       into it, landing on the signature gradient. ~3s total, then hold.

  How it works (port notes for the app):
    - Three nested transform layers per blob, because the motions compose:
        orbit  — rotates around the shared canvas center; this is what
                 carries the blob around the track
        spread — pushes the blob outward along its own center axis (in the
                 orbit's rotating frame, so the track just gets wider) and
                 scales it down while chasing
        keel   — counter-rotates by the orbit's exact curve/duration so
                 the blob travels UPRIGHT instead of pinwheeling
    - The chase feel comes from A and B running the same rotation with
      different easing curves: B starts faster and closes ~90-100° of the
      gap mid-lap, then A pulls away. Curves are tuned so the blobs never
      overlap mid-chase (see tokens below).
    - Shapes morph continuously between three matched-point path variants
      (generated by scripts/generate-blobs.mjs — variants must keep one
      command structure to tween). CSS `d: path()` needs a recent engine
      (Chromium, Firefox 97+, Safari 18+); in a native rebuild (Rive /
      Lottie / RN Skia) tween the control points directly.

  Tokens (the numbers that define the motion):
    lap duration        loader 2.6s/lap · splash 1.8s (one lap)
    easing A (leader)   cubic-bezier(0.6, 0.02, 0.15, 1)
    easing B (chaser)   cubic-bezier(0.3, 0.1, 0.28, 1)
    spread              65 viewBox units outward, scale 0.82
    morph cadence       a shape change every ~0.5s
    canvas              viewBox 0 0 640 520, track center (320, 260)
    colors              sky #3ea6c2 · teal #2f7d6b · butter #ffcb57 ·
                        coral #ff7357 · warm bg #faf7f2
    blob A gradient     signature: sky → teal → butter (160°)
    blob B gradient     coral → teal (135°-ish)
    splash dispersal    A scales ×15 (ease-in) from 1.2s; B scales ×7,
                        blurs 18px and fades from 1.4s; both over ~1.4s
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Handsful — blob chase motion spec</title>
<style>
  :root {
    --sky: #3ea6c2;
    --teal: #2f7d6b;
    --coral: #ff7357;
    --butter: #ffcb57;
    --warm-bg: #faf7f2;
    --ink: #22201d;
    --ease-a: cubic-bezier(0.6, 0.02, 0.15, 1);
    --ease-b: cubic-bezier(0.3, 0.1, 0.28, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--warm-bg);
    color: var(--ink);
    padding: 48px 24px 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-bottom: 12px; }
  p.note { max-width: 52ch; font-size: 14px; line-height: 21px; color: #6b665e; }
  .row { display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; }
  .demo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .stage {
    width: 320px;
    height: 260px;
    border-radius: 24px;
    background: var(--warm-bg);
    box-shadow: 0 2px 16px rgba(34, 32, 29, 0.12);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage svg { width: 82%; height: auto; overflow: visible; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 6px 16px;
    border: 1px solid var(--teal);
    border-radius: 999px;
    background: #fff;
    color: var(--teal);
    cursor: pointer;
  }

  /* ---- shared blob shape variants (matched-point, safe to tween) ----- */
  .chase {
    --blob-a-0: path('M394.9 250.8 C395.6 286.0 375.6 344.2 345.0 370.5 C314.5 396.8 245.1 406.8 211.5 408.6 C177.9 410.4 165.5 408.8 143.5 381.2 C121.5 353.6 85.5 285.5 79.7 243.0 C73.8 200.4 83.7 152.5 108.7 125.8 C133.6 99.0 190.7 76.9 229.4 82.5 C268.1 88.0 313.3 131.1 340.9 159.1 C368.5 187.2 394.2 215.5 394.9 250.8 Z');
    --blob-a-1: path('M379.6 230.4 C384.2 264.7 371.6 326.1 346.7 352.3 C321.8 378.5 268.8 386.4 230.2 387.7 C191.7 388.9 144.3 382.0 115.5 360.1 C86.8 338.2 55.6 297.3 57.9 256.1 C60.2 214.9 101.9 141.4 129.3 113.0 C156.7 84.6 190.7 80.0 222.4 85.5 C254.0 91.0 293.1 121.9 319.3 146.0 C345.5 170.2 375.0 196.0 379.6 230.4 Z');
    --blob-a-2: path('M418.6 268.6 C419.4 307.8 374.3 317.7 341.1 339.4 C308.0 361.1 257.0 395.2 219.7 399.0 C182.4 402.9 137.9 390.5 117.6 362.3 C97.3 334.1 95.8 272.2 97.9 230.0 C100.0 187.7 108.4 127.4 130.2 108.8 C152.0 90.1 194.3 118.7 228.6 118.0 C262.9 117.3 304.4 79.6 336.1 104.7 C367.7 129.8 417.7 229.5 418.6 268.6 Z');
    --blob-b-0: path('M555.4 293.8 C555.6 323.0 556.8 355.8 538.9 376.8 C521.0 397.8 479.4 420.6 448.0 419.9 C416.5 419.2 371.0 390.3 350.1 372.6 C329.2 354.8 320.7 337.8 322.6 313.2 C324.5 288.7 341.8 248.4 361.6 225.4 C381.3 202.4 411.8 179.2 441.1 175.3 C470.4 171.3 518.3 182.0 537.4 201.8 C556.4 221.5 555.1 264.7 555.4 293.8 Z');
    --blob-b-1: path('M562.3 302.3 C565.6 332.8 553.8 373.2 532.5 388.6 C511.3 404.1 465.8 395.5 434.6 395.1 C403.5 394.6 365.2 406.2 345.8 385.8 C326.3 365.4 312.1 302.1 317.9 272.6 C323.6 243.1 355.4 230.5 380.2 208.8 C405.0 187.1 444.5 142.9 466.6 142.4 C488.8 141.9 497.1 179.2 513.0 205.9 C529.0 232.5 559.1 271.9 562.3 302.3 Z');
    --blob-b-2: path('M557.3 281.5 C558.8 309.3 565.2 332.6 546.3 352.4 C527.3 372.2 473.8 394.8 443.5 400.2 C413.2 405.7 384.6 405.3 364.4 385.1 C344.2 365.0 324.0 306.5 322.3 279.2 C320.7 251.9 336.5 243.4 354.4 221.3 C372.4 199.2 399.6 152.7 430.1 146.8 C460.6 140.8 516.3 163.1 537.5 185.6 C558.7 208.0 555.9 253.7 557.3 281.5 Z');
  }
  .orbit { transform-box: view-box; transform-origin: center; will-change: transform; }
  .spread, .keel { transform-box: fill-box; transform-origin: center; will-change: transform; }
  .blob { transform-box: fill-box; transform-origin: center; }

  @keyframes lap        { from { transform: rotate(0deg); }  to { transform: rotate(360deg); } }
  @keyframes lap-counter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @keyframes morph-a {
    0%   { d: var(--blob-a-0); }
    20%  { d: var(--blob-a-1); }
    40%  { d: var(--blob-a-2); }
    60%  { d: var(--blob-a-0); }
    80%  { d: var(--blob-a-1); }
    100% { d: var(--blob-a-2); }
  }
  @keyframes morph-b {
    0%   { d: var(--blob-b-0); }
    20%  { d: var(--blob-b-2); }
    40%  { d: var(--blob-b-1); }
    60%  { d: var(--blob-b-0); }
    80%  { d: var(--blob-b-2); }
    100% { d: var(--blob-b-1); }
  }
  /* Loop-safe morphs for the loader: end shape = start shape */
  @keyframes morph-a-loop {
    0%, 100% { d: var(--blob-a-0); }
    25%      { d: var(--blob-a-1); }
    50%      { d: var(--blob-a-2); }
    75%      { d: var(--blob-a-1); }
  }
  @keyframes morph-b-loop {
    0%, 100% { d: var(--blob-b-0); }
    25%      { d: var(--blob-b-2); }
    50%      { d: var(--blob-b-1); }
    75%      { d: var(--blob-b-2); }
  }

  /* ---- 1. LOADER: spring apart once, then lap forever ---------------- */
  .loader .spread--a { animation: spread-in-a 0.9s ease-in-out both; }
  .loader .spread--b { animation: spread-in-b 0.9s ease-in-out both; }
  @keyframes spread-in-a { to { transform: translate(-64px, -12px) scale(0.82); } }
  @keyframes spread-in-b { to { transform: translate(64px, 12px) scale(0.82); } }
  .loader .orbit--a { animation: lap 2.6s var(--ease-a) infinite; }
  .loader .keel--a  { animation: lap-counter 2.6s var(--ease-a) infinite; }
  .loader .orbit--b { animation: lap 2.6s var(--ease-b) infinite; }
  .loader .keel--b  { animation: lap-counter 2.6s var(--ease-b) infinite; }
  .loader .blob--a  { animation: morph-a-loop 5.2s ease-in-out infinite; }
  .loader .blob--b  { animation: morph-b-loop 5.2s ease-in-out infinite; }

  /* ---- 2. SPLASH: one lap, then disperse into the gradient ----------- */
  .splash .orbit--a  { animation: lap 1.8s var(--ease-a) both; }
  .splash .keel--a   { animation: lap-counter 1.8s var(--ease-a) both; }
  .splash .orbit--b  { animation: lap 1.8s var(--ease-b) both; }
  .splash .keel--b   { animation: lap-counter 1.8s var(--ease-b) both; }
  .splash .spread--a { animation: spread-a 1.8s ease-in-out both; }
  .splash .spread--b { animation: spread-b 1.8s ease-in-out both; }
  @keyframes spread-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    22%, 78% { transform: translate(-64px, -12px) scale(0.82); }
  }
  @keyframes spread-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    22%, 78% { transform: translate(64px, 12px) scale(0.82); }
  }
  .splash .blob--a {
    animation:
      morph-a 2.6s ease-in-out both,
      takeover 1.5s cubic-bezier(0.55, 0, 0.85, 0.45) 1.2s both;
  }
  .splash .blob--b {
    animation:
      morph-b 2.6s ease-in-out both,
      dissolve 1.3s cubic-bezier(0.42, 0, 1, 1) 1.4s both;
    will-change: transform, opacity, filter;
  }
  @keyframes takeover { to { transform: scale(15); } }
  @keyframes dissolve {
    from { filter: blur(0px); }
    to   { transform: scale(7); opacity: 0; filter: blur(18px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loader *, .splash * { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>Handsful blob chase</h1>
  <p class="note">
    The website hero's intro animation, packaged for reuse. Left: the infinite
    loader loop. Right: the one-shot splash (chase, then the gradient takes
    the screen). All tokens and port notes are in this file's source.
  </p>

  <div class="row">
    <div class="demo">
      <h2>Loader (loops forever)</h2>
      <div class="stage">
        <svg class="chase loader" viewBox="0 0 640 520" fill="none" role="img" aria-label="Two Handsful blobs chasing each other in a circle">
          <defs>
            <linearGradient id="grad-a" x1="0.15" y1="0" x2="0.75" y2="1">
              <stop offset="0" stop-color="#3ea6c2"/>
              <stop offset="0.55" stop-color="#2f7d6b"/>
              <stop offset="1" stop-color="#ffcb57"/>
            </linearGradient>
            <linearGradient id="grad-b" x1="0.2" y1="0.05" x2="0.7" y2="1">
              <stop offset="0" stop-color="#ff7357"/>
              <stop offset="1" stop-color="#2f7d6b"/>
            </linearGradient>
          </defs>
          <g class="orbit orbit--a"><g class="spread spread--a"><g class="keel keel--a">
            <path class="blob blob--a" fill="url(#grad-a)" d="M394.9 250.8 C395.6 286.0 375.6 344.2 345.0 370.5 C314.5 396.8 245.1 406.8 211.5 408.6 C177.9 410.4 165.5 408.8 143.5 381.2 C121.5 353.6 85.5 285.5 79.7 243.0 C73.8 200.4 83.7 152.5 108.7 125.8 C133.6 99.0 190.7 76.9 229.4 82.5 C268.1 88.0 313.3 131.1 340.9 159.1 C368.5 187.2 394.2 215.5 394.9 250.8 Z"/>
          </g></g></g>
          <g class="orbit orbit--b"><g class="spread spread--b"><g class="keel keel--b">
            <path class="blob blob--b" fill="url(#grad-b)" d="M555.4 293.8 C555.6 323.0 556.8 355.8 538.9 376.8 C521.0 397.8 479.4 420.6 448.0 419.9 C416.5 419.2 371.0 390.3 350.1 372.6 C329.2 354.8 320.7 337.8 322.6 313.2 C324.5 288.7 341.8 248.4 361.6 225.4 C381.3 202.4 411.8 179.2 441.1 175.3 C470.4 171.3 518.3 182.0 537.4 201.8 C556.4 221.5 555.1 264.7 555.4 293.8 Z"/>
          </g></g></g>
        </svg>
      </div>
    </div>

    <div class="demo">
      <h2>Splash (one-shot)</h2>
      <div class="stage" id="splash-stage">
        <svg class="chase splash" viewBox="0 0 640 520" fill="none" role="img" aria-label="Handsful splash: two blobs chase, then melt into the brand gradient">
          <defs>
            <linearGradient id="sgrad-a" x1="0.15" y1="0" x2="0.75" y2="1">
              <stop offset="0" stop-color="#3ea6c2"/>
              <stop offset="0.55" stop-color="#2f7d6b"/>
              <stop offset="1" stop-color="#ffcb57"/>
            </linearGradient>
            <linearGradient id="sgrad-b" x1="0.2" y1="0.05" x2="0.7" y2="1">
              <stop offset="0" stop-color="#ff7357"/>
              <stop offset="1" stop-color="#2f7d6b"/>
            </linearGradient>
          </defs>
          <g class="orbit orbit--a"><g class="spread spread--a"><g class="keel keel--a">
            <path class="blob blob--a" fill="url(#sgrad-a)" d="M394.9 250.8 C395.6 286.0 375.6 344.2 345.0 370.5 C314.5 396.8 245.1 406.8 211.5 408.6 C177.9 410.4 165.5 408.8 143.5 381.2 C121.5 353.6 85.5 285.5 79.7 243.0 C73.8 200.4 83.7 152.5 108.7 125.8 C133.6 99.0 190.7 76.9 229.4 82.5 C268.1 88.0 313.3 131.1 340.9 159.1 C368.5 187.2 394.2 215.5 394.9 250.8 Z"/>
          </g></g></g>
          <g class="orbit orbit--b"><g class="spread spread--b"><g class="keel keel--b">
            <path class="blob blob--b" fill="url(#sgrad-b)" d="M555.4 293.8 C555.6 323.0 556.8 355.8 538.9 376.8 C521.0 397.8 479.4 420.6 448.0 419.9 C416.5 419.2 371.0 390.3 350.1 372.6 C329.2 354.8 320.7 337.8 322.6 313.2 C324.5 288.7 341.8 248.4 361.6 225.4 C381.3 202.4 411.8 179.2 441.1 175.3 C470.4 171.3 518.3 182.0 537.4 201.8 C556.4 221.5 555.1 264.7 555.4 293.8 Z"/>
          </g></g></g>
        </svg>
      </div>
      <button type="button" id="replay">Replay</button>
    </div>
  </div>

  <script>
    // Replay by cloning the SVG — restarts every CSS animation in it.
    document.getElementById('replay').addEventListener('click', () => {
      const stage = document.getElementById('splash-stage');
      const svg = stage.querySelector('svg');
      stage.replaceChild(svg.cloneNode(true), svg);
    });
  </script>
</body>
</html>
