document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3px;font-weight:700;margin-bottom:8px;\">Clear space<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5B5148;line-height:1.6;\">Keep clear space equal to the height of the \"h\" ascender (call it <em>x<\u002Fem>) on all sides — no text, icons, or edges inside that space.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:13px;font-weight:700;margin-bottom:8px;\">Approved backgrounds<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5B5148;line-height:1.6;\">Ink #22201D, Warm bg #FAF7F2, Sky #3EA6C2, Teal-green #2F7D6B, and the signature gradient. Never on Coral or Butter directly (contrast fails).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px;\">\n      <div style=\"font-size:13px;font-weight:700;margin-bottom:10px;\">Misuse<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;\">\n        <div style=\"background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n          <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;color:#22201D;transform:scaleX(1.7);\">h<span style=\"position:relative;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11px;color:#8A4A3F;text-align:center;\">Don't stretch or distort<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n          <div style=\"position:relative;font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;color:#3EA6C2;\">h<div style=\"position:absolute;top:-2px;left:20px;width:7px;height:7px;border-radius:50%;background:#3EA6C2;\"><\u002Fdiv><div style=\"position:absolute;top:-2px;left:26px;width:7px;height:7px;border-radius:50%;background:#3EA6C2;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;color:#8A4A3F;text-align:center;\">Don't recolor the mark off-palette<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n          <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;color:#22201D;transform:rotate(18deg);\">h<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8A4A3F;text-align:center;\">Don't rotate or tilt<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFCB57;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n          <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;color:#22201D;\">h<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8A4A3F;text-align:center;\">Don't place on Butter or Coral<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1.2 Color -->\n  <div style=\"padding:0 64px 56px;\">\n    <div class=\"hf-label\">1.2 &nbsp;Color palette<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n      <div class=\"hf-card\" style=\"padding:0;overflow:hidden;\">\n        <div style=\"height:100px;background:#3EA6C2;\"><\u002Fdiv>\n        <div style=\"padding:14px 16px;\">\n          <div style=\"font-size:14px;font-weight:700;\">Sky — Primary<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">#3EA6C2 · RGB 62,166,194<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:6px;\">Navigation, links, active states, one stop of the action gradient. ~30% of any given screen.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\" style=\"padding:0;overflow:hidden;\">\n        <div style=\"height:100px;background:#2F7D6B;\"><\u002Fdiv>\n        <div style=\"padding:14px 16px;\">\n          <div style=\"font-size:14px;font-weight:700;\">Teal-green — Secondary<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">#2F7D6B · RGB 47,125,107<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:6px;\">Secondary headers, dark surfaces, second-baby identity color. ~15%.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\" style=\"padding:0;overflow:hidden;\">\n        <div style=\"height:100px;background:#FF7357;\"><\u002Fdiv>\n        <div style=\"padding:14px 16px;\">\n          <div style=\"font-size:14px;font-weight:700;\">Coral — Accent<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">#FF7357 · RGB 255,115,87<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:6px;\">Alerts, badges, secondary emphasis. Used sparingly — ~5% of a screen. Primary buttons use the action gradient, not solid Coral.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\" style=\"padding:0;overflow:hidden;\">\n        <div style=\"height:100px;background:#FFCB57;\"><\u002Fdiv>\n        <div style=\"padding:14px 16px;\">\n          <div style=\"font-size:14px;font-weight:700;\">Butter — Accent<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">#FFCB57 · RGB 255,203,87<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:6px;\">Highlights, badges, celebratory moments, nap/rest indicators. ~5%.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\" style=\"padding:0;overflow:hidden;\">\n        <div style=\"height:100px;background:#FAF7F2;border-bottom:1px solid rgba(0,0,0,.06);\"><\u002Fdiv>\n        <div style=\"padding:14px 16px;\">\n          <div style=\"font-size:14px;font-weight:700;\">Warm bg<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">#FAF7F2 · RGB 250,247,242<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:6px;\">Default app/page background, card surfaces. ~40%.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\" style=\"padding:0;overflow:hidden;\">\n        <div style=\"height:100px;background:#22201D;\"><\u002Fdiv>\n        <div style=\"padding:14px 16px;\">\n          <div style=\"font-size:14px;font-weight:700;\">Ink<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">#22201D · RGB 34,32,29<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#6E6459;margin-top:6px;\">Body text, dark-mode background, logo fill on light. ~5%.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px;background:#fff;border-radius:14px;padding:20px 22px;\">\n      <div style=\"font-size:13px;font-weight:700;margin-bottom:12px;\">Accessible text-on-color pairings<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:28px;height:28px;border-radius:6px;background:#FAF7F2;border:1px solid rgba(0,0,0,.08);\"><\u002Fdiv>Ink on Warm bg — 15.1:1<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:28px;height:28px;border-radius:6px;background:#3EA6C2;\"><\u002Fdiv>White on Sky — 2.4:1 <span style=\"color:#B5514A;\">(large text only)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:28px;height:28px;border-radius:6px;background:#2F7D6B;\"><\u002Fdiv>White on Teal-green — 4.6:1 ✓<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:28px;height:28px;border-radius:6px;background:#FF7357;\"><\u002Fdiv>White on Coral — 3.1:1 <span style=\"color:#B5514A;\">(bold/large only)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:28px;height:28px;border-radius:6px;background:#FFCB57;\"><\u002Fdiv>Ink on Butter — 10.8:1 ✓<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:28px;height:28px;border-radius:6px;background:#22201D;\"><\u002Fdiv>Warm bg on Ink — 15.1:1 ✓<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin-top:12px;\">Rule: on Sky or Coral, use white text only at 18px/700-weight or larger; for body copy, pair Sky/Coral with Ink text instead, or use them as fills behind icons rather than text.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1.3 Gradient -->\n  <div style=\"padding:0 64px 56px;\">\n    <div class=\"hf-label\">1.3 &nbsp;Gradients<\u002Fdiv>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;\">\n      <div style=\"flex:1;min-width:220px;background:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:16px;align-items:center;\">\n        <div style=\"flex:none;width:100px;height:100px;border-radius:16px;background:linear-gradient(160deg,#3EA6C2 0%,#2F7D6B 55%,#FFCB57 100%);\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px;font-weight:700;\">Signature gradient (marketing)<\u002Fdiv>\n          <div style=\"font-size:11px;color:#6E6459;font-family:ui-monospace,monospace;margin-top:6px;\">160deg, #3EA6C2 0%, #2F7D6B 55%, #FFCB57 100%<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#5B5148;margin-top:8px;line-height:1.5;\">App icon, splash screen, onboarding hero panels, marketing hero. Never a body bg, card fill, or behind long text.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:220px;background:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:16px;align-items:center;\">\n        <div style=\"flex:none;width:100px;height:100px;border-radius:16px;background:linear-gradient(135deg,#3EA6C2,#2F7D6B);\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px;font-weight:700;\">Action gradient (primary buttons)<\u002Fdiv>\n          <div style=\"font-size:11px;color:#6E6459;font-family:ui-monospace,monospace;margin-top:6px;\">135deg, #3EA6C2 → #2F7D6B<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#5B5148;margin-top:8px;line-height:1.5;\">The fill for every primary button, app + web — the app's one interactive gradient. Two-tone only; never the 3-stop signature.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:stretch;\">\n      <div style=\"flex:1;min-width:280px;background:#fff;border-radius:16px;padding:20px 22px;\">\n        <div style=\"font-size:13px;font-weight:700;margin-bottom:10px;\">Content-on-gradient rule<\u002Fdiv>\n        <div style=\"background:linear-gradient(160deg,#3EA6C2,#2F7D6B 55%,#FFCB57);border-radius:12px;padding:16px;margin-bottom:8px;\">\n          <div style=\"background:#fff;color:#2F7D6B;font-size:12px;font-weight:700;border-radius:10px;padding:9px 14px;display:inline-block;\">Solid button + solid text<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#22201D;border-radius:12px;padding:16px;\">\n          <div style=\"background:linear-gradient(135deg,#3EA6C2,#2F7D6B);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:9px 14px;display:inline-block;\">Gradient button on solid bg<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#6E6459;margin-top:10px;\">Gradient background → solid-color button and text. Solid background → gradient button allowed, text stays solid. Never gradient-on-gradient.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1.4 Type -->\n  <div style=\"padding:0 64px 56px;\">\n    <div class=\"hf-label\">1.4 &nbsp;Typography<\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:28px 32px;\">\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:48px;line-height:1.1;color:#22201D;\">H1 · Fredoka 700<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin-bottom:18px;\">48/56 · -0.01em · Page titles, hero headlines<\u002Fdiv>\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:600;font-size:34px;line-height:1.15;color:#22201D;\">H2 · Fredoka 600<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin-bottom:18px;\">34/40 · Section headers<\u002Fdiv>\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;line-height:1.2;color:#22201D;\">H3 · Fredoka 600<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin-bottom:18px;\">26/32 · Card/module titles<\u002Fdiv>\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:500;font-size:20px;line-height:1.25;color:#22201D;\">H4 · Fredoka 500<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin-bottom:18px;\">20/26 · Small headers, empty-state titles<\u002Fdiv>\n      <div style=\"font-family:'Karla',sans-serif;font-weight:400;font-size:17px;line-height:1.6;color:#3A342C;\">Body large · Karla 400 — used for the primary reading copy across screens, onboarding paragraphs, and notes.<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin:6px 0 18px;\">17/26<\u002Fdiv>\n      <div style=\"font-family:'Karla',sans-serif;font-weight:400;font-size:15px;line-height:1.55;color:#3A342C;\">Body · Karla 400 — default UI copy, list items, form labels.<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#6E6459;margin:6px 0 18px;\">15/22<\u002Fdiv>\n      <div style=\"display:flex;gap:32px;align-items:baseline;\">\n        <div><span style=\"font-family:'Karla',sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em;\">Button / Label<\u002Fspan><div style=\"font-size:11.5px;color:#6E6459;\">Karla 700 · 15/20 · +0.01em<\u002Fdiv><\u002Fdiv>\n        <div><span style=\"font-family:'Karla',sans-serif;font-weight:500;font-size:13px;color:#6E6459;\">Caption<\u002Fspan><div style=\"font-size:11.5px;color:#6E6459;\">Karla 500 · 13/18<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,.06);font-size:12.5px;color:#5B5148;line-height:1.6;\">\n        <strong>Rule:<\u002Fstrong> Fredoka is for headlines only — three lines or fewer, never body copy, lists, or long UI strings (legibility drops below ~20px). Karla handles everything functional: buttons, forms, navigation, notes, notifications.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1.5 Voice -->\n  <div style=\"padding:0 64px 56px;\">\n    <div class=\"hf-label\">1.5 &nbsp;Voice &amp; tone<\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;\">\n      <div style=\"background:#fff;border-radius:12px;padding:14px 16px;flex:1;min-width:200px;\"><div style=\"font-size:13px;font-weight:700;\">Warm, not saccharine<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Kind without baby-talk or exclamation overload.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:14px 16px;flex:1;min-width:200px;\"><div style=\"font-size:13px;font-weight:700;\">Competent, not clinical<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Precise data, human framing — never a hospital chart voice.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:14px 16px;flex:1;min-width:200px;\"><div style=\"font-size:13px;font-weight:700;\">Honest about hard nights<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Acknowledges exhaustion instead of pretending it's easy.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:14px 16px;flex:1;min-width:200px;\"><div style=\"font-size:13px;font-weight:700;\">Brief<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Parents are tired. Say it in one line if possible.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:14px 16px;flex:1;min-width:200px;\"><div style=\"font-size:13px;font-weight:700;\">Never guilt-trippy<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">No streak-shaming, no \"you missed a log\" scolding.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFF7E8;border:1px solid #FFCB57;border-radius:12px;padding:12px 16px;font-size:12.5px;color:#5B5148;margin-bottom:16px;\"><strong>Rule:<\u002Fstrong> never name a specific count or term (\"twins\", \"triplets\", two/three babies) in default copy — parents may have any number of multiples. Use generic language (\"your little ones\", \"everyone\") until the parent has set up child profiles; only then can copy reference their actual count/term.<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;\">\n      <div class=\"hf-card\"><div style=\"font-size:10.5px;font-weight:700;color:#3EA6C2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;\">Onboarding<\u002Fdiv><div style=\"font-size:13px;\">\"More little ones, more to track. Let's make it easy — however many you've got.\"<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:10.5px;font-weight:700;color:#3EA6C2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;\">Empty state<\u002Fdiv><div style=\"font-size:13px;\">\"Nothing logged yet today. No judgment — just tap when you're ready.\"<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:10.5px;font-weight:700;color:#3EA6C2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;\">Error<\u002Fdiv><div style=\"font-size:13px;\">\"That didn't save. Your data's safe — just try that log again.\"<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:10.5px;font-weight:700;color:#3EA6C2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;\">Push notification<\u002Fdiv><div style=\"font-size:13px;\">\"It's been 4 hours since Baby B's last feed — just a nudge, not a rule.\"<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:10.5px;font-weight:700;color:#3EA6C2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;\">Milestone<\u002Fdiv><div style=\"font-size:13px;\">\"Everyone slept 6 hours straight. Someone tell the history books.\"<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:10.5px;font-weight:700;color:#3EA6C2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;\">Settings / account<\u002Fdiv><div style=\"font-size:13px;\">\"Invite your partner — same kids, same data, no re-typing.\"<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1.6 Iconography + 1.7 Imagery -->\n  <div style=\"padding:0 64px 56px;display:flex;gap:16px;flex-wrap:wrap;\">\n    <div style=\"flex:1;min-width:320px;\">\n      <div class=\"hf-label\">1.6 &nbsp;Iconography<\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12.5px;color:#5B5148;line-height:1.7;\">Line icons on a 24px grid, 1.5px stroke, rounded caps &amp; joins, 2px corner radius on rectangular forms. Single-color only (Ink or Sky) — filled variant reserved for active/selected states. No gradient fills on icons.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:320px;\">\n      <div class=\"hf-label\">1.7 &nbsp;Imagery<\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12.5px;color:#5B5148;line-height:1.7;\">Icon- and color-driven by default — no photography or illustrated characters. If marketing ever needs a photo, keep it warm-toned, natural light, minimally edited, and never staged/stock-looking.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1.8 Accessibility -->\n  <div style=\"padding:0 64px 20px;\">\n    <div class=\"hf-label\">1.8 &nbsp;Accessibility standards<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;\">\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Contrast<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Body text ≥4.5:1 · large/headline text ≥3:1<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Tap targets<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">44×44pt minimum, 8px minimum gap between targets<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Font floors<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">13px UI minimum · 15px body minimum<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Status<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Never color alone — pair with icon or label<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 2. MOBILE APP SPECS ============ -->\n  <div id=\"mobile\" style=\"padding:80px 64px 20px;\">\n    <div class=\"hf-eyebrow\">Section 2<\u002Fdiv>\n    <div class=\"hf-h2\" style=\"font-size:34px;\">Mobile app specs<\u002Fdiv>\n    <div class=\"hf-sub\">React Native / Expo, iOS + Android. Spacing, components, dark mode, and motion for the tracking app.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 32px;\">\n    <div class=\"hf-label\">Spacing / grid<\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:flex-end;\">\n      <div style=\"text-align:center;\"><div style=\"width:4px;height:4px;background:#3EA6C2;margin:0 auto 6px;\"><\u002Fdiv><div style=\"font-size:10.5px;color:#6E6459;\">4 base<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center;\"><div style=\"width:8px;height:8px;background:#3EA6C2;margin:0 auto 6px;\"><\u002Fdiv><div style=\"font-size:10.5px;color:#6E6459;\">8 tight<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center;\"><div style=\"width:12px;height:12px;background:#3EA6C2;margin:0 auto 6px;\"><\u002Fdiv><div style=\"font-size:10.5px;color:#6E6459;\">12<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center;\"><div style=\"width:16px;height:16px;background:#3EA6C2;margin:0 auto 6px;\"><\u002Fdiv><div style=\"font-size:10.5px;color:#6E6459;\">16 default<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center;\"><div style=\"width:24px;height:24px;background:#3EA6C2;margin:0 auto 6px;\"><\u002Fdiv><div style=\"font-size:10.5px;color:#6E6459;\">24 section<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center;\"><div style=\"width:32px;height:32px;background:#3EA6C2;margin:0 auto 6px;\"><\u002Fdiv><div style=\"font-size:10.5px;color:#6E6459;\">32 screen edge<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 40px;\">\n    <div class=\"hf-label\">Core components<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n      <div class=\"hf-card\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;\">Buttons<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"background:linear-gradient(135deg,#3EA6C2,#2F7D6B);color:#fff;border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:700;\">Primary<\u002Fdiv>\n          <div style=\"background:#fff;color:#22201D;border:1.5px solid #22201D;border-radius:14px;padding:11px;text-align:center;font-size:13px;font-weight:700;\">Secondary<\u002Fdiv>\n          <div style=\"background:#EFEBE3;color:rgba(34,32,29,.4);border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:700;\">Disabled<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;\">Card<\u002Fdiv>\n        <div style=\"background:#FAF7F2;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);\">\n          <div style=\"font-size:12px;font-weight:700;\">Baby A<\u002Fdiv>\n          <div style=\"font-size:11px;color:#6E6459;margin-top:4px;\">Feed · Nap · Diaper<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;\">Bottom nav<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-around;background:#fff;border-radius:14px;padding:10px 8px 8px;border:1px solid rgba(0,0,0,.06);\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid #3EA6C2;padding-top:6px;\"><div style=\"width:14px;height:14px;border-radius:4px;background:#3EA6C2;\"><\u002Fdiv><div style=\"font-size:8px;font-weight:700;color:#3EA6C2;\">Tab<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid transparent;padding-top:6px;\"><div style=\"width:14px;height:14px;border-radius:4px;background:#D8D2C8;\"><\u002Fdiv><div style=\"font-size:8px;color:#8A8073;\">Tab<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid transparent;padding-top:6px;\"><div style=\"width:14px;height:14px;border-radius:4px;background:#D8D2C8;\"><\u002Fdiv><div style=\"font-size:8px;color:#8A8073;\">Tab<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#6E6459;margin-top:8px;line-height:1.5;\">Every tab = icon + text label underneath (never icon-only). Active tab gets a 2px Sky top border, plus Sky icon + label — tab count and names are product-defined, not brand-defined.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;\">Form field<\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid #E4DFD4;border-radius:12px;padding:11px 14px;font-size:12.5px;color:#6E6459;\">Baby's name<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;\">Toggle<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;align-items:center;\">\n          <div style=\"width:40px;height:24px;border-radius:12px;background:#3EA6C2;position:relative;\"><div style=\"width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;right:3px;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:40px;height:24px;border-radius:12px;background:#E4DFD4;position:relative;\"><div style=\"width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hf-card\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;\">Badge / tag<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n          <div style=\"background:#FFCB57;color:#22201D;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;\">sleep<\u002Fdiv>\n          <div style=\"background:#FF7357;color:#fff;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;\">question<\u002Fdiv>\n          <div style=\"background:#3EA6C2;color:#fff;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;\">feed<\u002Fdiv>\n          <div style=\"background:#2F7D6B;color:#fff;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;\">checkup<\u002Fdiv>\n          <div style=\"background:#22201D;color:#fff;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;\">diaper<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#6E6459;margin-top:8px;\">Any brand color works as a badge fill except white/cream — always pair with legible text (white or Ink, whichever contrasts).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;background:#fff;border-radius:14px;padding:16px 20px;\">\n      <div style=\"font-size:12px;font-weight:700;margin-bottom:6px;\">Modals / bottom sheets<\u002Fdiv>\n      <div style=\"font-size:12px;color:#6E6459;\">24px corner radius, drag handle, 90% max-height, backdrop at 40% Ink.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 40px;\">\n    <div class=\"hf-label\">Dark mode<\u002Fdiv>\n    <div style=\"background:#1B211F;border-radius:16px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;\">\n      <div style=\"display:flex;gap:8px;\">\n        <div style=\"width:44px;height:44px;border-radius:10px;background:#1B211F;border:1px solid rgba(255,255,255,.15);\"><\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:10px;background:#26302D;\"><\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:10px;background:#3EA6C2;\"><\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:10px;background:#FFCB57;\"><\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:10px;background:#F1EFEA;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#C9C4BC;max-width:520px;\">Background steps to #1B211F, surfaces lighten to #26302D. Sky, Coral, and Butter stay exactly the same hex — already tested for contrast on dark. Text becomes warm white #F1EFEA; secondary text #8E9591.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 20px;\">\n    <div class=\"hf-label\">Motion principles<\u002Fdiv>\n    <div style=\"background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:12px;\">\n      <div style=\"font-size:12.5px;color:#5B5148;line-height:1.6;\"><strong>Bounce is the brand's signature motion<\u002Fstrong> — a playful overshoot (spring / ease-out-back), never a flat linear or ease-in-out-only feel. This applies everywhere motion appears, app and website alike.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;\">\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Taps &amp; button presses<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">180–220ms, ease-out-back — a slight overshoot bounce, never linear.<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Screen / page transitions<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">260–320ms, spring-based slide + fade with a light bounce settle.<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Loading<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;margin-top:4px;\">Mark reveals in sequence — h, then each dot — staggered 200ms apart with a bounce pop-in, looping.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 3. LANDING PAGE SPECS ============ -->\n  <div id=\"web\" style=\"padding:80px 64px 20px;\">\n    <div class=\"hf-eyebrow\">Section 3<\u002Fdiv>\n    <div class=\"hf-h2\" style=\"font-size:34px;\">Landing page specs<\u002Fdiv>\n    <div class=\"hf-sub\">Marketing site conventions — breakpoints, hero pattern, and web-scale type.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 32px;\">\n    <div class=\"hf-label\">Breakpoints &amp; grid<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;\">\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Mobile<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;\">375px · 4-col · 16px gutter<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Tablet<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;\">768px · 8-col · 20px gutter<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Desktop<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;\">1024px · 12-col · 24px gutter<\u002Fdiv><\u002Fdiv>\n      <div class=\"hf-card\"><div style=\"font-size:13px;font-weight:700;\">Wide<\u002Fdiv><div style=\"font-size:11.5px;color:#6E6459;\">1440px · 12-col · 24px gutter, 1180px max content<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 40px;\">\n    <div class=\"hf-label\">Hero + header/footer pattern<\u002Fdiv>\n    <div style=\"border-radius:16px;overflow:hidden;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 24px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;\">\n          <svg width=\"20\" height=\"20\" viewBox=\"100 100 250 220\"><path d=\"M186.436 163.647C199.77 159.9 211.365 170.112 219.868 181.279C226.135 189.386 231.204 200.901 233.255 213.862C234.03 218.753 233.649 225.581 233.798 229.986V268.996C233.798 272.375 233.798 271.789 233.255 276.489C233.255 276.489 233.255 278.073 231.959 282.44C230.119 287.078 220.577 288.17 212.331 288.17C204.472 288.17 194.939 286.26 193.006 282.44C191.976 280.236 191.331 278.252 191.074 276.489C190.945 274.726 190.88 272.081 190.88 268.555V229.986C190.88 223.962 189.399 219.26 186.436 215.881C183.472 212.501 179.672 210.811 175.034 210.811C170.525 210.811 166.531 212.428 163.052 215.66C159.574 218.746 157.577 222.272 157.061 226.239V268.996C157.061 272.375 156.933 274.946 156.675 276.709C156.546 278.326 155.966 280.236 154.936 282.44C153.261 286.26 148.301 288.17 140.055 288.17C131.939 288.17 126.979 286.186 125.175 282.219C124.273 280.015 123.693 278.105 123.436 276.489C123.307 274.873 123.242 272.301 123.242 268.775V136.979C123.242 133.6 123.307 131.102 123.436 129.486C123.693 127.723 124.273 125.813 125.175 123.756C126.979 119.789 132.003 117.805 140.249 117.805C148.365 117.805 153.261 119.789 154.936 123.756C155.966 125.96 156.546 127.943 156.675 129.706C156.933 131.323 157.061 133.82 157.061 137.2V185.907C163.503 176.944 177.546 166.145 186.436 163.647Z\" fill=\"#22201D\"><\u002Fpath><circle cx=\"193.159\" cy=\"161.303\" r=\"14.4991\" fill=\"#FF7357\"><\u002Fcircle><circle cx=\"225.782\" cy=\"161.303\" r=\"14.4991\" fill=\"#22201D\"><\u002Fcircle><\u002Fsvg>\n          <div style=\"font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;\">handsful<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:24px;font-size:13px;font-weight:600;color:#22201D;\"><span>Features<\u002Fspan><span>Pricing<\u002Fspan><span>About<\u002Fspan><\u002Fdiv>\n        <div style=\"background:linear-gradient(135deg,#3EA6C2,#2F7D6B);color:#fff;font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:14px;\">Get the app<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(160deg,#3EA6C2,#2F7D6B 55%,#FFCB57);padding:64px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;\">\n        <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:38px;color:#fff;max-width:560px;line-height:1.15;\">You've got your hands full. We've got the tracking.<\u002Fdiv>\n        <div style=\"font-size:14px;color:rgba(255,255,255,.92);max-width:440px;\">Feeds, naps, and diapers for every little one — logged together, compared side by side.<\u002Fdiv>\n        <div style=\"background:#fff;color:#2F7D6B;font-size:14px;font-weight:700;padding:14px 28px;border-radius:16px;\">Download free<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#22201D;padding:28px 24px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#A69C90;\">\n        <span>© 2026 Handsful<\u002Fspan>\n        <div style=\"display:flex;gap:18px;\"><span>Privacy<\u002Fspan><span>Terms<\u002Fspan><span>Instagram<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;color:#6E6459;margin-top:10px;\">Web H1 scales up to 56/64 on desktop (vs 48/56 in-app); CTA buttons enlarge to 56px height on web vs 48px in-app. Section rhythm: 96px vertical padding between major sections, 56px on mobile.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 4. DO'S / DON'TS ============ -->\n  <div id=\"dodont\" style=\"padding:80px 64px 20px;\">\n    <div class=\"hf-eyebrow\">Section 4<\u002Fdiv>\n    <div class=\"hf-h2\" style=\"font-size:34px;\">Do's &amp; don'ts — quick reference<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 64px 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n    <div class=\"hf-card\">\n      <div style=\"font-size:13px;font-weight:700;margin-bottom:10px;\">Logo<\u002Fdiv>\n      <div style=\"font-size:12px;color:#2F7D6B;margin-bottom:4px;\">✓ Keep dots on the same horizontal line above the h<\u002Fdiv>\n      <div style=\"font-size:12px;color:#2F7D6B;margin-bottom:10px;\">✓ Use on approved backgrounds only<\u002Fdiv>\n      <div style=\"font-size:12px;color:#B5514A;\">✗ Never stretch, rotate, or recolor the mark<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hf-card\">\n      <div style=\"font-size:13px;font-weight:700;margin-bottom:10px;\">Color &amp; gradient<\u002Fdiv>\n      <div style=\"font-size:12px;color:#2F7D6B;margin-bottom:4px;\">✓ Two approved gradients only — the 3-stop signature (marketing) and the 2-tone action gradient (buttons)<\u002Fdiv>\n      <div style=\"font-size:12px;color:#2F7D6B;margin-bottom:10px;\">✓ Gradient bg pairs with solid buttons/text<\u002Fdiv>\n      <div style=\"font-size:12px;color:#B5514A;\">✗ No other gradient combinations — old \"Ocean/Sunrise/Twin\" explorations are retired<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hf-card\">\n      <div style=\"font-size:13px;font-weight:700;margin-bottom:10px;\">Voice<\u002Fdiv>\n      <div style=\"font-size:12px;color:#2F7D6B;margin-bottom:4px;\">✓ \"No judgment — log whenever you're ready\"<\u002Fdiv>\n      <div style=\"font-size:12px;color:#2F7D6B;margin-bottom:10px;\">✓ Brief, warm, a little wry<\u002Fdiv>\n      <div style=\"font-size:12px;color:#B5514A;\">✗ \"You missed 3 logs today!\" — never guilt-trip<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
